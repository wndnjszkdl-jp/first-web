<!DOCTYPE html>
<html lang="ko" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인 - 별 헤는 밤</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Google Fonts (Noto Serif KR & Noto Sans KR) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700&family=Noto+Serif+KR:wght@300;400;600;700&display=swap" rel="stylesheet">

    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Tailwind Configuration -->
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        night: {
                            900: '#0B0F19',
                            800: '#111827',
                            700: '#1F2937',
                            600: '#374151',
                        },
                        starlight: {
                            100: '#F3F4F6',
                            200: '#E5E7EB',
                            300: '#D1D5DB',
                            gold: '#F59E0B',
                            purple: '#A855F7',
                            indigo: '#6366F1',
                        }
                    },
                    fontFamily: {
                        sans: ['Noto Sans KR', 'sans-serif'],
                        serif: ['Noto Serif KR', 'serif'],
                    },
                    animation: {
                        'pulse-slow': 'pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                        'float': 'float 6s ease-in-out infinite',
                        'glow': 'glow 3s ease-in-out infinite alternate',
                    },
                    keyframes: {
                        float: {
                            '0%, 100%': { transform: 'translateY(0px)' },
                            '50%': { transform: 'translateY(-10px)' },
                        },
                        glow: {
                            '0%': { opacity: '0.4', filter: 'blur(20px)' },
                            '100%': { opacity: '0.8', filter: 'blur(30px)' },
                        }
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #070A12;
            color: #E2E8F0;
            font-family: 'Noto Sans KR', sans-serif;
            overflow-x: hidden;
        }

        /* Glassmorphism Styles */
        .glass-panel {
            background: rgba(18, 24, 43, 0.65);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        .glass-input {
            background: rgba(10, 14, 26, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(8px);
            color: #F3F4F6;
        }
        .glass-input:focus {
            border-color: #A855F7;
            box-shadow: 0 0 15px rgba(168, 85, 247, 0.3);
            outline: none;
        }

        /* Background Star Particles */
        .stars-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }
        .star {
            position: absolute;
            background-color: #ffffff;
            border-radius: 50%;
            animation: twinkle var(--duration, 3s) infinite ease-in-out var(--delay, 0s);
        }
        @keyframes twinkle {
            0%, 100% { opacity: 0.2; transform: scale(0.8); }
            50% { opacity: 0.9; transform: scale(1.2); }
        }

        /* Gradient Text */
        .gradient-text {
            background: linear-gradient(135deg, #E2E8F0 0%, #A855F7 50%, #818CF8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between relative selection:bg-purple-500 selection:text-white">

    <!-- Background Stars Effect -->
    <div id="stars-container" class="stars-container"></div>

    <!-- Ambient Glow Lights -->
    <div class="fixed -top-40 -left-40 w-96 h-96 bg-purple-900/30 rounded-full blur-3xl pointer-events-none animate-glow"></div>
    <div class="fixed top-1/2 -right-40 w-96 h-96 bg-indigo-900/20 rounded-full blur-3xl pointer-events-none animate-glow" style="animation-delay: 1.5s;"></div>
    <div class="fixed -bottom-40 left-1/3 w-96 h-96 bg-blue-900/20 rounded-full blur-3xl pointer-events-none animate-glow" style="animation-delay: 3s;"></div>

    <!-- Header Navigation -->
    <header class="relative z-10 border-b border-white/10 glass-panel">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
            <a href="/" class="flex items-center space-x-3 group">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-purple-600 via-indigo-500 to-amber-300 flex items-center justify-center shadow-lg shadow-purple-500/20 group-hover:scale-105 transition-transform duration-300">
                    <i class="fa-solid fa-moon text-slate-950 text-xl"></i>
                </div>
                <div>
                    <span class="font-serif text-2xl font-bold tracking-tight text-white group-hover:text-purple-300 transition-colors">별 헤는 밤</span>
                    <span class="hidden sm:inline-block text-xs text-purple-300/70 ml-2 font-sans">AI 감성 독서 코치</span>
                </div>
            </a>

            <a href="/" class="text-xs sm:text-sm text-slate-300 hover:text-white flex items-center gap-2 px-3 py-2 rounded-lg bg-white/5 hover:bg-white/10 transition-all border border-white/10">
                <i class="fa-solid fa-house text-purple-400"></i>
                <span>홈으로 돌아가기</span>
            </a>
        </div>
    </header>

    <!-- Main Content Container -->
    <main class="relative z-10 flex-grow flex items-center justify-center px-4 py-12">
        <div class="w-full max-w-md">
            <!-- Glassmorphism Login Card -->
            <div class="glass-panel p-8 sm:p-10 rounded-3xl border border-white/10 shadow-2xl relative overflow-hidden transition-all duration-300 hover:border-purple-500/30">
                
                <!-- Decorative Top Star Icon -->
                <div class="w-12 h-12 mx-auto mb-6 rounded-2xl bg-gradient-to-tr from-purple-600/30 to-indigo-600/30 border border-purple-400/30 flex items-center justify-center shadow-inner">
                    <i class="fa-solid fa-user-astronaut text-xl text-purple-300 animate-float"></i>
                </div>

                <!-- Card Title & Subtitle -->
                <div class="text-center mb-8">
                    <h1 class="font-serif text-2xl sm:text-3xl font-bold text-white mb-2 tracking-tight">로그인</h1>
                    <p class="text-xs sm:text-sm text-slate-400">다시, 밤하늘 별빛 아래 당신만의 문장 속으로</p>
                </div>

                <!-- Flask Integrated Login Form -->
                <form method="POST" class="space-y-6">
                    <!-- Username Field -->
                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-300 mb-2 flex items-center gap-2">
                            <i class="fa-solid fa-user text-purple-400"></i>
                            <span>아이디</span>
                        </label>
                        <input type="text" name="username" required placeholder="아이디를 입력하세요" 
                            class="w-full px-4 py-3.5 rounded-xl glass-input text-sm transition-all placeholder:text-slate-500 focus:ring-2 focus:ring-purple-500/50">
                    </div>

                    <!-- Password Field -->
                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-300 mb-2 flex items-center gap-2">
                            <i class="fa-solid fa-lock text-purple-400"></i>
                            <span>비밀번호</span>
                        </label>
                        <input type="password" name="password" required placeholder="비밀번호를 입력하세요" 
                            class="w-full px-4 py-3.5 rounded-xl glass-input text-sm transition-all placeholder:text-slate-500 focus:ring-2 focus:ring-purple-500/50">
                    </div>

                    <!-- Submit Button -->
                    <button type="submit" 
                        class="w-full py-4 rounded-xl font-medium text-white bg-gradient-to-r from-purple-600 via-indigo-600 to-purple-700 hover:from-purple-500 hover:to-indigo-500 shadow-lg shadow-purple-900/50 transition-all hover:scale-[1.02] active:scale-[0.98] flex items-center justify-center gap-2 group">
                        <i class="fa-solid fa-right-to-bracket group-hover:translate-x-1 transition-transform"></i>
                        <span>로그인</span>
                    </button>
                </form>

                <!-- Divider -->
                <div class="relative my-8 text-center">
                    <div class="absolute inset-0 flex items-center">
                        <div class="w-full border-t border-white/10"></div>
                    </div>
                    <span class="relative px-4 text-xs text-slate-500 bg-[#0c1222] rounded-full">또는</span>
                </div>

                <!-- Signup Redirect Link -->
                <div class="text-center">
                    <a href="/signup" class="text-xs sm:text-sm text-purple-300 hover:text-purple-200 transition-colors inline-flex items-center gap-1.5 font-medium hover:underline">
                        <span>아직 회원이 아니신가요?</span>
                        <i class="fa-solid fa-arrow-right text-xs"></i>
                    </a>
                </div>

            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="relative z-10 glass-panel border-t border-white/10 py-6 px-4 text-center">
        <p class="text-xs text-slate-500">
            &copy; 2026 별 헤는 밤 (Starry Night Reading Coach). All rights reserved.
        </p>
    </footer>

    <!-- JavaScript for Stars Background Animation -->
    <script>
        window.addEventListener('DOMContentLoaded', () => {
            generateStars();
        });

        function generateStars() {
            const container = document.getElementById('stars-container');
            const count = 50;
            for (let i = 0; i < count; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                const size = Math.random() * 2.5 + 1;
                star.style.width = `${size}px`;
                star.style.height = `${size}px`;
                star.style.top = `${Math.random() * 100}%`;
                star.style.left = `${Math.random() * 100}%`;
                star.style.setProperty('--duration', `${Math.random() * 3 + 2}s`);
                star.style.setProperty('--delay', `${Math.random() * 2}s`);
                container.appendChild(star);
            }
        }
    </script>
</body>
</html>
